name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eas-build:
    name: EAS Build (${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}

    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ "$HAS_EXPO_TOKEN" != "true" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::EXPO_TOKEN is not set in repo secrets. Add it under Settings → Secrets → Actions."
              exit 1
            fi
            echo "EXPO_TOKEN is not set; skipping EAS preview on main."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "skip=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Expo
        if: env.skip != 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: env.skip != 'true'
        run: npm ci

      - name: Resolve build profile
        if: env.skip != 'true'
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with EAS
        if: env.skip != 'true'
        run: eas build --platform ios --profile ${{ steps.profile.outputs.name }} --non-interactive
